<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dungeon Survivor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b11;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{touch-action:none}
canvas{display:block;width:100vw;height:100vh;background:#0b1218}.hud{position:fixed;inset:0;pointer-events:none}.panel{background:#0b1220e8;border:1px solid #39465f;border-radius:13px;box-shadow:0 10px 30px #0008}
#stats{position:absolute;left:14px;top:14px;width:280px;padding:12px}.title{font-size:18px;font-weight:900;color:#f0c66b}.row{display:flex;justify-content:space-between;font-size:12px;margin-top:7px;color:#bac4d6}.bar{height:10px;background:#20283a;border-radius:99px;margin-top:4px;overflow:hidden}.hp{height:100%;background:#ef5f73}.xp{height:100%;background:#6ca5ff}
#mapbox{position:absolute;right:14px;top:14px;width:220px;padding:10px}#mini{width:198px;height:125px;display:block;background:#111924;border:1px solid #34415a;border-radius:9px}#objective{font-size:11px;line-height:1.5;color:#bcc5d5;margin-top:8px}
#guard{position:absolute;right:14px;top:165px;pointer-events:auto;padding:9px 13px;border-radius:10px;border:1px solid #aa7c36;background:#1f180d;color:#ffe5ab;font-weight:900;cursor:pointer}
#tip{position:absolute;left:14px;bottom:14px;padding:8px 11px;color:#adb7ca;font-size:11px}
#overlay{position:absolute;inset:0;display:none;place-items:center;background:#000a;pointer-events:auto}.box{width:min(700px,92vw);padding:26px;text-align:center}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.card{background:#141c2a;border:1px solid #3b4963;border-radius:11px;padding:15px;text-align:left;cursor:pointer}.card:hover{border-color:#e7b35a}.card b{display:block;color:#f0c66b;margin-bottom:7px}.card small{color:#b7c1d2;line-height:1.5}
#touch{display:none;position:fixed;inset:0;pointer-events:none}#stick{position:absolute;left:18px;bottom:18px;width:120px;height:120px;border-radius:50%;border:1px solid #fff2;background:#fff1;pointer-events:auto}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#e8b75d99}#atk{position:absolute;right:20px;bottom:25px;width:95px;height:95px;border-radius:50%;display:grid;place-items:center;border:1px solid #e8b75daa;background:#e8b75d22;pointer-events:auto;font-weight:900}
@media(max-width:900px){#touch{display:block}#stats{transform:scale(.86);transform-origin:top left}#mapbox{transform:scale(.86);transform-origin:top right}#tip{display:none}}
</style></head><body>
<canvas id="game" width="1280" height="720"></canvas><div class="hud">
<div id="stats" class="panel"><div class="title">圣光骑士</div><div class="row"><span>生命</span><b id="hp">140 / 140</b></div><div class="bar"><div id="hpbar" class="hp"></div></div><div class="row"><span>Lv.<b id="lv">1</b></span><b id="xp">0 / 55</b></div><div class="bar"><div id="xpbar" class="xp"></div></div><div class="row"><span>金币 <b id="gold">0</b></span><span>击杀 <b id="kills">0</b></span></div></div>
<div id="mapbox" class="panel"><canvas id="mini" width="198" height="125"></canvas><div id="objective">荒野平原 · 大地图<br>小兵与狼王同时存在<br>目标：找到并击败狼王<br><b id="enemyCount">0</b> 个敌人存活</div></div>
<button id="guard">⚔ 护身轮转剑：开启（1）</button><div id="tip" class="panel">WASD / 方向键移动 · 鼠标左键攻击 · Shift 闪避 · R 重开</div>
<div id="overlay"><div class="box panel" id="levelBox"><h2 id="ovTitle">升级！</h2><div id="ovDesc">选择一项强化继续战斗。</div><div id="choices" class="choices"></div><button id="restart" style="display:none;margin-top:16px;padding:11px 20px;border:0;border-radius:11px;background:#e8b55e;font-weight:900">重新进入荒野</button></div></div>
</div><div id="touch"><div id="stick"><div id="knob"></div></div><div id="atk">攻击</div></div>
<script>
(()=>{"use strict";
const c=document.getElementById("game"),g=c.getContext("2d"),m=document.getElementById("mini"),mg=m.getContext("2d");
const W=1280,H=720,MW=3600,MH=2400,TAU=Math.PI*2,$=id=>document.getElementById(id),K={};let state="play",last=0,shake=0,guard=true,kills=0;
let cam={x:MW/2,y:MH/2},shots=[],fx=[],floaters=[],drops=[],enemies=[],decor=[];
let p={x:MW/2,y:MH/2,r:22,hp:140,maxHp:140,spd:300,dmg:38,rate:.38,t:0,lv:1,xp:0,next:55,gold:0,inv:0,dash:0,ga:0,gd:24,gh:{}};
const R=(a,b)=>Math.random()*(b-a)+a,C=(v,a,b)=>Math.max(a,Math.min(b,v)),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
addEventListener("keydown",e=>{K[e.key.toLowerCase()]=1;if(["arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==="1")toggleGuard()});addEventListener("keyup",e=>delete K[e.key.toLowerCase()]);
c.addEventListener("mousemove",e=>{let r=c.getBoundingClientRect();aim.x=(e.clientX-r.left)*W/r.width;aim.y=(e.clientY-r.top)*H/r.height});c.addEventListener("mousedown",e=>{if(e.button===0)mouseDown=1});addEventListener("mouseup",()=>mouseDown=0);let aim={x:W/2+50,y:H/2},mouseDown=0;
const stick=$("stick"),knob=$("knob"),atk=$("atk");let dragging=0,touchMove={x:0,y:0};stick.addEventListener("pointerdown",e=>{dragging=1;stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener("pointermove",e=>dragging&&stickMove(e));stick.addEventListener("pointerup",clearStick);stick.addEventListener("pointercancel",clearStick);atk.addEventListener("pointerdown",()=>mouseDown=1);addEventListener("pointerup",()=>mouseDown=0);
function stickMove(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),z=Math.hypot(dx,dy)||1,d=Math.min(42,z);touchMove.x=dx/z;touchMove.y=dy/z;knob.style.left=35+touchMove.x*d+"px";knob.style.top=35+touchMove.y*d+"px"}function clearStick(){dragging=0;touchMove.x=touchMove.y=0;knob.style.left="35px";knob.style.top="35px"}
$("guard").onclick=toggleGuard;function toggleGuard(){guard=!guard;$("guard").textContent="⚔ 护身轮转剑："+(guard?"开启（1）":"关闭（1）")}
function reset(){state="play";last=performance.now();shake=0;kills=0;shots=[];fx=[];floaters=[];drops=[];p={x:MW/2,y:MH/2,r:22,hp:140,maxHp:140,spd:300,dmg:38,rate:.38,t:0,lv:1,xp:0,next:55,gold:0,inv:0,dash:0,ga:0,gd:24,gh:{}};$("overlay").style.display="none";build()}
function build(){decor=[];enemies=[];for(let i=0;i<150;i++)decor.push({x:R(60,MW-60),y:R(60,MH-60),t:Math.random()<.55?"tree":"rock",s:R(.7,1.3)});let ts=["goblin","goblin","skeleton","wolf"];for(let i=0;i<56;i++){let q=mkEnemy(ts[i%4]);while(D(q,p)<420)q=mkEnemy(ts[i%4]);enemies.push(q)}enemies.push(mkEnemy("boss"))}
function mkEnemy(t){let x=R(90,MW-90),y=R(90,MH-90);if(t==="boss"){x=MW-420;y=MH-330}let d={goblin:[46,150,10,45],skeleton:[76,100,12,65],wolf:[62,240,15,54],boss:[1550,85,28,150]}[t];return{x,y,t,hp:d[0],max:d[0],spd:d[1],dmg:d[2],r:t==="boss"?48:24,cool:R(.2,1),sp:R(1,3),flash:0}}
function gain(n){p.xp+=n;if(p.xp>=p.next){p.xp-=p.next;p.lv++;p.next=Math.floor(p.next*1.35);levelUp()}}
const ups=[["圣剑淬炼","攻击伤害 +28%",()=>p.dmg*=1.28],["极速步伐","移动速度 +18%",()=>p.spd*=1.18],["圣光壁垒","最大生命 +30",()=>{p.maxHp+=30;p.hp=Math.min(p.maxHp,p.hp+30)}],["连斩节奏","攻击间隔 -20%",()=>p.rate*=.8],["暴击祝福","暴击率 +8%",()=>p.crit=(p.crit||.1)+.08],["轮转强化","护身剑伤害 +35%",()=>p.gd*=1.35]];
function levelUp(){state="level";$("overlay").style.display="grid";$("restart").style.display="none";$("ovTitle").textContent="圣光升级";$("ovDesc").textContent="选择一项强化继续战斗";let box=$("choices");box.innerHTML="";ups.slice().sort(()=>Math.random()-.5).slice(0,3).forEach(u=>{let d=document.createElement("div");d.className="card";d.innerHTML="<b>"+u[0]+"</b><small>"+u[1]+"</small>";d.onclick=()=>{u[2]();$("overlay").style.display="none";state="play"};box.appendChild(d)})}
function die(){state="dead";$("overlay").style.display="grid";$("ovTitle").textContent="你倒下了";$("ovDesc").innerHTML="等级 "+p.lv+" · 击杀 "+kills+" · 金币 "+Math.floor(p.gold);$("choices").innerHTML="";$("restart").style.display="inline-block";$("restart").onclick=reset}
function win(){state="win";$("overlay").style.display="grid";$("ovTitle").textContent="狼王已败！";$("ovDesc").innerHTML="荒野平原的首领已被击败。<br>击杀 "+kills+" · 等级 "+p.lv+" · 金币 "+Math.floor(p.gold);$("choices").innerHTML="";$("restart").style.display="inline-block"}
function hitPlayer(n){if(p.inv>0||state!=="play")return;p.hp=Math.max(0,p.hp-n);p.inv=.38;shake=7;fx.push({t:"burst",x:p.x,y:p.y,l:.3,big:0});if(!p.hp)die()}
function enemyHit(e,n){e.hp-=n;e.flash=.1;floaters.push({x:e.x+R(-8,8),y:e.y-28,v:-34,l:.7,s:"-"+Math.round(n),crit:n>p.dmg*1.5});fx.push({t:"burst",x:e.x,y:e.y,l:.25,big:0});if(e.hp<=0){kills++;p.gold+=e.t==="boss"?300:Math.floor(R(2,8));gain(e.t==="boss"?280:12);if(e.t!=="boss"&&Math.random()<.35)drops.push({x:e.x,y:e.y});fx.push({t:"death",x:e.x,y:e.y,l:.6,big:e.t==="boss"});shake=e.t==="boss"?17:5;if(e.t==="boss")win()}}
function attack(){if(p.t>0)return;let a=Math.atan2(cam.y-H/2+aim.y-p.y,cam.x-W/2+aim.x-p.x),dmg=p.dmg*(Math.random()<(p.crit||.1)?2:1);p.t=p.rate;fx.push({t:"slash",x:p.x,y:p.y,a,l:.22});for(let e of enemies){if(e.hp<=0)continue;let dx=e.x-p.x,dy=e.y-p.y,dd=Math.hypot(dx,dy),da=Math.atan2(dy,dx)-a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;if(dd<118&&Math.abs(da)<.82)enemyHit(e,dmg)}}
function updateGuard(dt){if(!guard)return;p.ga=(p.ga+dt*2.4)%TAU;for(let i=0;i<6;i++){let a=p.ga+i*TAU/6,gx=p.x+Math.cos(a)*88,gy=p.y+Math.sin(a)*88;for(let e of enemies){if(e.hp<=0)continue;if(Math.hypot(e.x-gx,e.y-gy)<e.r+15){let k=i+"_"+enemies.indexOf(e);if(!p.gh[k]){enemyHit(e,p.gd);p.gh[k]=.33}}}}for(let k in p.gh){p.gh[k]-=dt;if(p.gh[k]<=0)delete p.gh[k]}}
function updateEnemy(e,dt){if(e.hp<=0)return;e.cool=Math.max(0,e.cool-dt);e.sp=Math.max(0,e.sp-dt);e.flash=Math.max(0,e.flash-dt);let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;if(e.t==="boss"){if(d>280){e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt}if(e.sp<=0&&d<1000){e.sp=2.7;for(let i=0;i<12;i++){let a=i*TAU/12;shots.push({x:e.x,y:e.y,vx:Math.cos(a)*220,vy:Math.sin(a)*220,r:9,l:4,enemy:1})}fx.push({t:"cast",x:e.x,y:e.y,l:.55})}}else if(e.t==="skeleton"){if(d>390){e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt}if(e.cool<=0&&d<650){e.cool=1.7;let a=Math.atan2(dy,dx);shots.push({x:e.x,y:e.y,vx:Math.cos(a)*290,vy:Math.sin(a)*290,r:7,l:3,enemy:1})}}else{if(d>e.r+p.r+9){e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt}else if(e.cool<=0){hitPlayer(e.dmg);e.cool=e.t==="wolf"?.75:1.05;if(e.t==="wolf"){e.x+=dx/d*65;e.y+=dy/d*65}}}}
function move(dt){let mx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),my=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);if(touchMove.x||touchMove.y){mx=touchMove.x;my=touchMove.y}let z=Math.hypot(mx,my)||1;if(K.shift&&p.dash<=0&&z){K.shift=0;p.dash=.38;p.inv=.3;fx.push({t:"dash",x:p.x,y:p.y,l:.25})}let sp=p.dash>0?p.spd*2.2:p.spd;p.x=C(p.x+mx/z*sp*dt,45,MW-45);p.y=C(p.y+my/z*sp*dt,45,MH-45);p.dash=Math.max(0,p.dash-dt)}
function update(dt){if(state==="dead"||state==="win"){if(K.r){delete K.r;reset()}return}if(state!=="play")return;p.t=Math.max(0,p.t-dt);p.inv=Math.max(0,p.inv-dt);move(dt);if(mouseDown)attack();updateGuard(dt);for(let e of enemies)updateEnemy(e,dt);for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt;if(s.enemy&&Math.hypot(s.x-p.x,s.y-p.y)<s.r+p.r){hitPlayer(s.r>8?18:11);shots.splice(i,1);continue}if(s.l<=0)shots.splice(i,1)}for(let i=drops.length-1;i>=0;i--){let d=drops[i];if(D(d,p)<34){p.gold+=10;drops.splice(i,1);fx.push({t:"coin",x:d.x,y:d.y,l:.25})}}for(let i=fx.length-1;i>=0;i--){fx[i].l-=dt;if(fx[i].l<=0)fx.splice(i,1)}for(let i=floaters.length-1;i>=0;i--){floaters[i].y+=floaters[i].v*dt;floaters[i].l-=dt;if(floaters[i].l<=0)floaters.splice(i,1)}shake=Math.max(0,shake-dt*30);cam.x+=(p.x-cam.x)*Math.min(1,dt*7);cam.y+=(p.y-cam.y)*Math.min(1,dt*7)}
function sx(x){return x-cam.x+W/2}function sy(y){return y-cam.y+H/2}
function bg(){g.fillStyle="#0b1418";g.fillRect(0,0,W,H);g.fillStyle="#17291f";g.fillRect(sx(0),sy(0),MW,MH);g.strokeStyle="#385344";g.lineWidth=4;g.strokeRect(sx(0),sy(0),MW,MH);g.strokeStyle="rgba(220,240,225,.045)";g.lineWidth=1;let gx=Math.floor(cam.x/100)*100-900,gy=Math.floor(cam.y/100)*100-500;for(let x=gx;x<cam.x+900;x+=100){g.beginPath();g.moveTo(sx(x),0);g.lineTo(sx(x),H);g.stroke()}for(let y=gy;y<cam.y+700;y+=100){g.beginPath();g.moveTo(0,sy(y));g.lineTo(W,sy(y));g.stroke()}for(let d of decor){let x=sx(d.x),y=sy(d.y);if(x<-70||x>W+70||y<-70||y>H+70)continue;if(d.t==="tree"){g.fillStyle="#203226";g.fillRect(x-5*d.s,y+8*d.s,10*d.s,25*d.s);g.fillStyle="#31583c";g.beginPath();g.arc(x,y,23*d.s,0,TAU);g.fill();g.fillStyle="#3e6b49";g.beginPath();g.arc(x-10*d.s,y,11*d.s,0,TAU);g.arc(x+10*d.s,y+4*d.s,11*d.s,0,TAU);g.fill()}else{g.fillStyle="#5f6a66";g.beginPath();g.ellipse(x,y,16*d.s,10*d.s,0,0,TAU);g.fill()}}}
function sprite(t,x,y,s,flip){g.save();g.translate(x,y);if(flip)g.scale(-1,1);let q=s;if(t==="hero"){g.fillStyle="#09111b";g.fillRect(-10*q,9*q,20*q,16*q);g.fillStyle="#d7a540";g.fillRect(-8*q,0,16*q,15*q);g.fillStyle="#fff1bf";g.fillRect(-5*q,-9*q,10*q,9*q);g.fillStyle="#e9c76a";g.fillRect(-8*q,-11*q,16*q,6*q);g.fillStyle="#1f63b7";g.fillRect(-2*q,4*q,4*q,5*q);g.fillStyle="#fff";g.fillRect(9*q,-3*q,20*q,3*q);g.fillStyle="#2a5795";g.fillRect(-11*q,15*q,22*q,6*q)}else if(t==="goblin"){g.fillStyle="#2e5b37";g.fillRect(-9*q,-2*q,18*q,18*q);g.fillStyle="#78ad45";g.fillRect(-8*q,-10*q,16*q,10*q);g.fillStyle="#8fc84f";g.fillRect(-13*q,-7*q,5*q,5*q);g.fillRect(8*q,-7*q,5*q,5*q);g.fillStyle="#ff4d51";g.fillRect(-5*q,-6*q,3*q,3*q);g.fillRect(3*q,-6*q,3*q,3*q)}else if(t==="skeleton"){g.strokeStyle="#ded9c8";g.lineWidth=3*q;g.beginPath();g.moveTo(-6*q,5*q);g.lineTo(6*q,5*q);g.moveTo(-5*q,10*q);g.lineTo(5*q,10*q);g.moveTo(-6*q,5*q);g.lineTo(-12*q,-4*q);g.moveTo(6*q,5*q);g.lineTo(13*q,-3*q);g.moveTo(-5*q,10*q);g.lineTo(-10*q,19*q);g.moveTo(5*q,10*q);g.lineTo(10*q,19*q);g.stroke();g.fillStyle="#ece9db";g.fillRect(-7*q,-11*q,14*q,12*q);g.fillStyle="#1b2230";g.fillRect(-4*q,-7*q,3*q,3*q);g.fillRect(2*q,-7*q,3*q,3*q)}else{let z=t==="boss"?1.55:1;g.fillStyle=t==="boss"?"#644b80":"#5c6879";g.beginPath();g.moveTo(-24*q*z,8*q*z);g.lineTo(-12*q*z,-8*q*z);g.lineTo(-2*q*z,-18*q*z);g.lineTo(10*q*z,-12*q*z);g.lineTo(22*q*z,-5*q*z);g.lineTo(30*q*z,4*q*z);g.lineTo(22*q*z,13*q*z);g.lineTo(4*q*z,14*q*z);g.lineTo(-9*q*z,12*q*z);g.closePath();g.fill();g.fillStyle="#d7dde7";g.fillRect(17*q*z,-4*q*z,5*q*z,4*q*z);g.fillStyle="#ef4850";g.fillRect(18*q*z,-3*q*z,2*q*z,2*q*z)}g.restore()}
function draw(){g.clearRect(0,0,W,H);g.save();g.translate(shake?R(-shake,shake):0,shake?R(-shake,shake):0);bg();for(let e of enemies){if(e.hp<=0)continue;let x=sx(e.x),y=sy(e.y);if(x<-90||x>W+90||y<-90||y>H+90)continue;g.fillStyle="#0005";g.beginPath();g.ellipse(x,y+22,e.r,8,0,0,TAU);g.fill();sprite(e.t==="boss"?"boss":e.t,x,y,e.t==="boss"?1.8:1.55,e.x<p.x);g.fillStyle="#181d27";g.fillRect(x-e.r,y-e.r-14,e.r*2,5);g.fillStyle=e.t==="boss"?"#c95bff":"#e56872";g.fillRect(x-e.r,y-e.r-14,e.r*2*e.hp/e.max,5)}if(guard)for(let i=0;i<6;i++){let a=p.ga+i*TAU/6,x=sx(p.x+Math.cos(a)*88),y=sy(p.y+Math.sin(a)*88);g.save();g.translate(x,y);g.rotate(a+Math.PI/2);g.fillStyle="#f2c15c";g.beginPath();g.moveTo(0,-18);g.lineTo(5,6);g.lineTo(0,18);g.lineTo(-5,6);g.closePath();g.fill();g.fillStyle="#4f98ef";g.fillRect(-2,-11,4,13);g.restore()}let px=sx(p.x),py=sy(p.y);g.fillStyle="#0006";g.beginPath();g.ellipse(px,py+25,24,8,0,0,TAU);g.fill();sprite("hero",px,py,2.05,false);for(let s of shots){g.fillStyle=s.enemy?"#db63ff":"#8ec9ff";g.shadowBlur=12;g.shadowColor=g.fillStyle;g.beginPath();g.arc(sx(s.x),sy(s.y),s.r,0,TAU);g.fill();g.shadowBlur=0}for(let e of fx){let x=sx(e.x),y=sy(e.y),a=Math.max(0,e.l*2);if(e.t==="slash"){g.save();g.translate(x,y);g.rotate(e.a);g.strokeStyle="rgba(255,227,145,"+a+")";g.lineWidth=10;g.beginPath();g.arc(0,0,94,-.9,.9);g.stroke();g.strokeStyle="rgba(86,153,255,"+a+")";g.lineWidth=4;g.beginPath();g.arc(0,0,104,-.78,.78);g.stroke();g.restore()}else if(e.t==="burst"||e.t==="death"){let z=e.big?65:28;g.fillStyle="rgba(255,108,75,"+a+")";g.beginPath();g.arc(x,y,(1-e.l/.65)*z,0,TAU);g.fill();for(let i=0;i<8;i++){let an=i*TAU/8;g.strokeStyle="rgba(255,212,120,"+a+")";g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(an)*z,y+Math.sin(an)*z);g.stroke()}}else if(e.t==="cast"){g.strokeStyle="rgba(212,84,255,"+a+")";g.lineWidth=5;g.beginPath();g.arc(x,y,80+(1-e.l/.55)*120,0,TAU);g.stroke()}}for(let f of floaters){g.font="800 "+(f.crit?19:15)+"px system-ui";g.textAlign="center";g.strokeStyle="#11151f";g.lineWidth=3;g.strokeText(f.s,sx(f.x),sy(f.y));g.fillStyle=f.crit?"#ffe16a":"#fff";g.fillText(f.s,sx(f.x),sy(f.y));}g.restore();drawMini();updateUI()}
function drawMini(){mg.clearRect(0,0,198,125);mg.fillStyle="#0d1520";mg.fillRect(0,0,198,125);mg.strokeStyle="#3a465b";mg.strokeRect(1,1,196,123);let fx=v=>v/MW*198,fy=v=>v/MH*125;for(let e of enemies){if(e.hp<=0)continue;mg.fillStyle=e.t==="boss"?"#e76cff":"#d96872";mg.fillRect(fx(e.x)-1,fy(e.y)-1,e.t==="boss"?4:2,e.t==="boss"?4:2)}mg.fillStyle="#77b9ff";mg.beginPath();mg.arc(fx(p.x),fy(p.y),4,0,TAU);mg.fill()}
function updateUI(){$("hp").textContent=Math.ceil(p.hp)+" / "+p.maxHp;$("hpbar").style.width=p.hp/p.maxHp*100+"%";$("xp").textContent=Math.floor(p.xp)+" / "+p.next;$("xpbar").style.width=p.xp/p.next*100+"%";$("lv").textContent=p.lv;$("gold").textContent=Math.floor(p.gold);$("kills").textContent=kills;$("enemyCount").textContent=enemies.filter(e=>e.hp>0).length}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
})();
</script></body></html>
