<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dungeon Survivor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{touch-action:none}
#game{width:100vw;height:100vh;display:block;background:#0b0f18;cursor:crosshair}
#hud{position:fixed;inset:0;pointer-events:none}.panel{background:rgba(9,13,23,.88);border:1px solid #30394f;border-radius:14px;box-shadow:0 10px 30px #0008}
#top{position:absolute;left:16px;top:14px;width:285px;padding:12px 14px}.row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.bar{height:11px;background:#202638;border-radius:99px;overflow:hidden}.fill{height:100%;width:0}.hp{background:#ef6375}.xp{background:#6ea7ff}
#boss{display:none;position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(560px,70vw);padding:10px 14px}.bossfill{background:#c661ff}
#tip{position:absolute;right:16px;bottom:15px;padding:9px 12px;font-size:12px;color:#aab4c8}
#message{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:18px;font-weight:800;text-shadow:0 2px 10px #000}
#level{display:none;position:absolute;inset:0;place-items:center;background:#0007;pointer-events:auto}.levelbox{padding:26px;width:min(700px,92vw);text-align:center}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card{padding:18px;background:#151b29;border:1px solid #36415c;border-radius:12px;text-align:left;cursor:pointer}.card:hover{border-color:#eeb15b}.card b{display:block;margin-bottom:8px}.card small{color:#aab4c8;line-height:1.5}
#touch{display:none}.stick{position:absolute;left:22px;bottom:22px;width:122px;height:122px;border-radius:50%;background:#fff1;border:1px solid #fff2;pointer-events:auto}.knob{position:absolute;left:36px;top:36px;width:50px;height:50px;border-radius:50%;background:#eeb15b99}#attack{position:absolute;right:24px;bottom:38px;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:#eeb15b22;border:1px solid #eeb15b99;pointer-events:auto}
@media(max-width:900px){#touch{display:block}.panel{transform:scale(.92);transform-origin:top left}#tip{display:none}}
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="hud">
<div id="top" class="panel">
<div class="row"><span>生命</span><b id="hpText">100 / 100</b></div><div class="bar"><div id="hpFill" class="fill hp"></div></div>
<div class="row" style="margin-top:8px"><span>经验 Lv.<span id="levelText">1</span></span><b id="xpText">0 / 35</b></div><div class="bar"><div id="xpFill" class="fill xp"></div></div>
<div class="row" style="margin-top:10px"><span>地牢层数</span><b id="floorText">1</b></div><div class="row"><span>金币</span><b id="goldText">0</b></div>
</div>
<div id="boss" class="panel"><div class="row"><span>深渊领主</span><b id="bossText"></b></div><div class="bar"><div id="bossFill" class="fill bossfill"></div></div></div>
<div id="message"></div><div id="tip" class="panel">WASD / 方向键移动 · 鼠标左键攻击 · Shift 闪避 · 清空房间后向右走</div>
<div id="level"><div class="levelbox panel"><h2>升级！</h2><div>选择一项强化后继续</div><div class="choices" id="choices"></div></div></div>
</div>
<div id="touch"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div id="attack">攻击</div></div>
<script>
(()=>{"use strict";
const c=document.getElementById("game"),x=c.getContext("2d"),W=1280,H=720;
const $=id=>document.getElementById(id);
const keys=Object.create(null),mouse={x:W/2,y:H/2,down:false};
let touch={x:0,y:0},touchAttack=false,player=null,room=null,floor=1,roomNo=1,rooms=[],shots=[],parts=[],drops=[],state="play",last=0,shake=0,totalKills=0;
const R=(a,b)=>Math.random()*(b-a)+a, D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), C=(v,a,b)=>Math.max(a,Math.min(b,v));
addEventListener("keydown",e=>{const k=e.key.toLowerCase();keys[k]=true;if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
c.addEventListener("mousemove",e=>{const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});
c.addEventListener("mousedown",e=>{if(e.button===0)mouse.down=true});addEventListener("mouseup",()=>mouse.down=false);
const stick=$("stick"),knob=$("knob"),attack=$("attack");let dragging=false;
stick.addEventListener("pointerdown",e=>{dragging=true;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener("pointermove",e=>dragging&&moveStick(e));stick.addEventListener("pointerup",clearStick);stick.addEventListener("pointercancel",clearStick);
function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,d=Math.min(42,m);touch.x=dx/m;touch.y=dy/m;knob.style.left=36+touch.x*d+"px";knob.style.top=36+touch.y*d+"px"}function clearStick(){dragging=false;touch.x=touch.y=0;knob.style.left="36px";knob.style.top="36px"}
attack.addEventListener("pointerdown",()=>touchAttack=true);addEventListener("pointerup",()=>touchAttack=false);
function burst(px,py,n,type){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:R(-180,180),vy:R(-180,180),life:R(.2,.6),r:R(2,5),type})}
function enemy(boss=false){const a=R(0,Math.PI*2),rad=R(180,270),sc=1+floor*.12;return{x:C(W/2+Math.cos(a)*rad,110,W-110),y:C(H/2+Math.sin(a)*rad,120,H-100),r:boss?40:20,maxHp:(boss?520:72)*sc,hp:(boss?520:72)*sc,speed:boss?70:105+floor*2,damage:boss?20:9+floor*.7,cd:R(.2,.8),boss,flash:0}}
function makeRoom(isBoss){const e=[];for(let i=0;i<(isBoss?0:Math.min(4+floor*2,14));i++)e.push(enemy(false));if(isBoss)e.push(enemy(true));return{boss:isBoss,enemies:e,cleared:false}}
function startFloor(){rooms=[];const count=floor%5===0?2:3;for(let i=0;i<count;i++)rooms.push(makeRoom(floor%5===0&&i===count-1));roomNo=1;room=rooms[0];shots=[];drops=[];player.x=W/2;player.y=H/2;player.inv=.45}
function reset(){floor=1;totalKills=0;player={x:W/2,y:H/2,r:18,hp:100,maxHp:100,speed:250,damage:26,rate:.33,timer:0,level:1,xp:0,next:35,gold:0,inv:0,dodge:0,crit:.08,life:0};startFloor()}
function nextRoom(){roomNo++;if(roomNo>rooms.length){floor++;startFloor()}else{room=rooms[roomNo-1];shots=[];drops=[];player.x=W/2;player.y=H/2;player.hp=Math.min(player.maxHp,player.hp+18);player.inv=.5}}
const upgrades=[["锋利之刃","伤害 +25%",()=>player.damage*=1.25],["迅捷身法","移动速度 +18%",()=>player.speed*=1.18],["生命强化","最大生命 +25，并回复",()=>{player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+25)}],["狂战节奏","攻击间隔 -20%",()=>player.rate*=.8],["致命一击","暴击率 +8%",()=>player.crit+=.08],["吸血意志","击杀回复 3 点",()=>player.life+=3]];
function levelUp(){state="level";$("level").style.display="grid";const box=$("choices");box.innerHTML="";upgrades.slice().sort(()=>Math.random()-.5).slice(0,3).forEach(u=>{const d=document.createElement("div");d.className="card";d.innerHTML="<b>"+u[0]+"</b><small>"+u[1]+"</small>";d.onclick=()=>{u[2]();$("level").style.display="none";state="play"};box.appendChild(d)})}
function xp(n){player.xp+=n;while(player.xp>=player.next){player.xp-=player.next;player.level++;player.next=Math.floor(player.next*1.28);levelUp();break}}
function hurt(n){if(player.inv>0||state!=="play")return;player.hp=Math.max(0,player.hp-n);player.inv=.5;shake=8;burst(player.x,player.y,12,"hit");if(player.hp===0){state="dead";$("message").textContent="冒险结束　·　按 R 重新挑战"}}
function fire(){if(player.timer>0)return;let dx=mouse.x-player.x,dy=mouse.y-player.y;if(touchAttack){const t=room.enemies.find(e=>e.hp>0);if(t){dx=t.x-player.x;dy=t.y-player.y}else dx=1,dy=0}const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;shots.push({x:player.x+dx*25,y:player.y+dy*25,vx:dx*620,vy:dy*620,r:6,life:.8,dmg:player.damage*(Math.random()<player.crit?2:1)});player.timer=player.rate;burst(player.x+dx*22,player.y+dy*22,4,"spark")}
function kill(e){totalKills++;player.gold+=e.boss?80:5;xp(e.boss?100:12);if(player.life)player.hp=Math.min(player.maxHp,player.hp+player.life);burst(e.x,e.y,e.boss?35:14,"death");if(!e.boss&&Math.random()<.45)drops.push({x:e.x,y:e.y,v:10+Math.floor(R(0,10))});if(e.boss||room.enemies.every(a=>a.hp<=0)){room.cleared=true}}
function update(dt){if(state==="dead"){if(keys.r){delete keys.r;reset()}return}if(state!=="play")return;
player.timer=Math.max(0,player.timer-dt);player.inv=Math.max(0,player.inv-dt);player.dodge=Math.max(0,player.dodge-dt);
let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(touch.x||touch.y){mx=touch.x;my=touch.y}
const m=Math.hypot(mx,my)||1;if(keys.shift&&player.dodge<=0&&m>0){player.dodge=.95;player.inv=.25;player.x+=mx/m*130;player.y+=my/m*130}
const sp=player.dodge>0&&player.dodge<.8?player.speed*1.7:player.speed;player.x=C(player.x+mx/m*sp*dt,72,1208);player.y=C(player.y+my/m*sp*dt,96,644);if(mouse.down||touchAttack)fire();
room.enemies.forEach(e=>{if(e.hp<=0)return;e.cd=Math.max(0,e.cd-dt);e.flash=Math.max(0,e.flash-dt);let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;if(d>e.r+player.r+10){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}if(d<e.r+player.r+5&&e.cd<=0){hurt(e.damage);e.cd=e.boss?.85:1}});
for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;let hit=false;for(const e of room.enemies)if(e.hp>0&&Math.hypot(e.x-s.x,e.y-s.y)<e.r+s.r){e.hp-=s.dmg;e.flash=.1;burst(s.x,s.y,5,"spark");hit=true;if(e.hp<=0)kill(e);break}if(hit||s.life<=0||s.x<0||s.x>W||s.y<0||s.y>H)shots.splice(i,1)}
for(let i=drops.length-1;i>=0;i--){const d=drops[i];if(Math.hypot(d.x-player.x,d.y-player.y)<28){player.gold+=d.v;drops.splice(i,1);burst(d.x,d.y,7,"spark")}}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
if(room.cleared&&player.x>1120)nextRoom();shake=Math.max(0,shake-dt*25)}
function draw(){x.clearRect(0,0,W,H);x.save();x.translate(shake?R(-shake,shake):0,shake?R(-shake,shake):0);
const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#111827");g.addColorStop(1,"#080c14");x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle="#171d2a";x.fillRect(48,70,W-96,H-110);x.strokeStyle="#3c4660";x.lineWidth=3;x.strokeRect(48,70,W-96,H-110);
x.strokeStyle="#252c3d";x.lineWidth=1;for(let xx=70;xx<1210;xx+=50){x.beginPath();x.moveTo(xx,95);x.lineTo(xx,640);x.stroke()}for(let yy=95;yy<640;yy+=50){x.beginPath();x.moveTo(70,yy);x.lineTo(1210,yy);x.stroke()}
room.enemies.forEach(e=>{if(e.hp<=0)return;x.fillStyle=e.flash>0?"#fff":e.boss?"#bd58ee":"#d05c67";x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();x.fillStyle="#111";x.beginPath();x.arc(e.x-e.r*.3,e.y-e.r*.1,3,0,7);x.arc(e.x+e.r*.3,e.y-e.r*.1,3,0,7);x.fill();x.fillStyle="#2a3042";x.fillRect(e.x-e.r,e.y-e.r-12,e.r*2,5);x.fillStyle=e.boss?"#d66dff":"#f07075";x.fillRect(e.x-e.r,e.y-e.r-12,e.r*2*e.hp/e.maxHp,5)});
drops.forEach(d=>{x.fillStyle="#f1b25c";x.beginPath();x.arc(d.x,d.y,9,0,7);x.fill();});
shots.forEach(s=>{x.fillStyle="#ffd58e";x.shadowBlur=14;x.shadowColor="#eeb15b";x.beginPath();x.arc(s.x,s.y,6,0,7);x.fill();x.shadowBlur=0});
parts.forEach(p=>{x.globalAlpha=Math.max(0,p.life*2);x.fillStyle=p.type==="hit"?"#ef6172":"#f1b25c";x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.globalAlpha=1});
x.save();x.translate(player.x,player.y);x.rotate(Math.atan2(mouse.y-player.y,mouse.x-player.x));x.fillStyle="#0b0f18";x.beginPath();x.arc(0,0,22,0,7);x.fill();x.fillStyle=player.inv>0?"#fff":"#64b8ff";x.beginPath();x.arc(0,0,18,0,7);x.fill();x.fillStyle="#d9efff";x.fillRect(9,-4,26,8);x.restore();
if(room.cleared){x.fillStyle="#7ff0b066";x.fillRect(1130,240,80,230);x.fillStyle="#9af0c0";x.font="bold 16px system-ui";x.textAlign="center";x.fillText("出口",1170,225);x.textAlign="left"}
x.restore();updateUI()}
function updateUI(){if(!player)return;$("hpText").textContent=Math.ceil(player.hp)+" / "+Math.ceil(player.maxHp);$("hpFill").style.width=player.hp/player.maxHp*100+"%";$("xpText").textContent=Math.floor(player.xp)+" / "+player.next;$("xpFill").style.width=player.xp/player.next*100+"%";$("levelText").textContent=player.level;$("floorText").textContent=floor;$("goldText").textContent=player.gold;const b=room.enemies.find(e=>e.boss&&e.hp>0);$("boss").style.display=b?"block":"none";if(b){$("bossText").textContent=Math.ceil(b.hp)+" / "+Math.ceil(b.maxHp);$("bossFill").style.width=b.hp/b.maxHp*100+"%"}}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
})();</script>
</body></html>
